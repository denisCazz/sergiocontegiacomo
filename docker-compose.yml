services:
  postgres:
    image: postgres:16-alpine
    container_name: sergio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sergio_sito
      POSTGRES_USER: ${POSTGRES_USER:-sergio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sergio} -d sergio_sito"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
